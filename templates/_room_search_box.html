{#- 個別の教室を検索する入力欄。「個別の教室を検索」ページと1週間ページで共通 -#}
<form class="room-search" method="GET" action="{{ url_for('room_search') }}" role="search">
    <label for="room-q">教室名・教室番号</label>
    <div class="room-search-row">
        <input type="search" id="room-q" name="q" value="{{ room_query|default('') }}" list="room-list"
               placeholder="例: S303、1511" autocomplete="off" enterkeyhint="search" maxlength="40">
        <button type="submit" class="room-search-btn">1週間を見る</button>
    </div>
    <input type="hidden" name="year" value="{{ year if year is not none else '' }}" class="room-search-year">
    <input type="hidden" name="term" value="{{ term }}" class="room-search-term">
    <datalist id="room-list">
        {% for r in room_list %}<option value="{{ r.name }}">{{ r.building }}</option>{% endfor %}
    </datalist>
    <div class="room-recent" id="room-recent" hidden>
        <span class="room-recent-label">最近見た教室</span>
        <span class="room-recent-chips"></span>
    </div>
</form>
