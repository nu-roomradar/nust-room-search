name: GA4 週次の記録

# 毎週月曜 6:07 JST に、直前の1週（月〜日）の利用状況を data/ga4_weekly.* に追記する。
# main への push で Render が再デプロイされるので、授業時間（平日 9:00–20:30）を避けた早朝に回す。
# 必要な Secrets: GA4_PROPERTY_ID / GA4_SA_KEY（docs/OPERATIONS.md 4.6）
on:
  schedule:
    - cron: "7 21 * * 0"   # 日曜 21:07 UTC = 月曜 6:07 JST
  workflow_dispatch:
    inputs:
      weeks:
        description: "直前の何週ぶんを取り直すか（初回は 4 など）"
        default: "1"

permissions:
  contents: write

jobs:
  ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        # 版とハッシュを固定（README 参照）
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/ga4.txt
      - name: Fetch GA4
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          WEEKS: ${{ inputs.weeks || '1' }}   # 入力値は env で渡す（run に直接埋め込まない）
        run: python scripts/fetch_ga4_metrics.py --weeks "$WEEKS"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ga4_weekly.json data/ga4_weekly.md data/ga4_history.json data/ga4_breakdown.json
          if git diff --staged --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore: GA4 週次の記録を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git pull --rebase origin main && git push
