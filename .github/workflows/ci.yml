name: CI

# 運用スクリプトと Claude Code の hook が壊れていないかを毎回確かめる。
# 「検証できないなら出荷しない」の最小構成。app.py の本格的なテストは今後追加する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile app.py scripts/*.py .claude/hooks/guard-notices.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
