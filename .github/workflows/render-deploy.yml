name: 検索アプリを Render に反映

# Render の自動デプロイは切ってある（2026-10-26 運営決定）。main に入ったアプリの変更を、
# 授業のない時間（月〜土の 20:30 以降と朝 9:00 まで、日曜）にだけ Render の Deploy Hook で反映する。
# 再デプロイすると「実は使われていた」報告が消えるため。判定は scripts/render_deploy.py。
# 急ぎの直しは Actions の画面から「Run workflow」で force にチェックを入れて実行する（報告は消える）。
# 設定（Render の自動デプロイを切る・Deploy Hook を Secrets に入れる）は docs/OPERATIONS.md 4.10。
on:
  push:
    branches: [main]
  schedule:
    # 毎日 20:40 JST（UTC 11:40）。授業のある時間に main に入った変更をまとめて出す
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "授業時間中でもすぐ反映する（いまある報告は消えます）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write   # 反映したコミットを GitHub の Deployments（環境 render）に記録する

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0               # 前回反映したコミットとの差分を見るため
          persist-credentials: false   # push しないので、トークンをディスクに残さない
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: 前回反映したコミットを調べる
        id: last
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.repos.listDeployments({
              owner: context.repo.owner, repo: context.repo.repo, environment: 'render', per_page: 1 });
            core.setOutput('sha', data.length ? data[0].sha : '');

      - name: 反映するか決める
        id: decide
        env:
          BASE: ${{ steps.last.outputs.sha }}
          FORCE: ${{ inputs.force }}   # 入力値は env で渡す（run に直接埋め込まない）
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/render_deploy.py --base "$BASE" --force
          else
            python scripts/render_deploy.py --base "$BASE"
          fi

      - name: Render の Deploy Hook を呼ぶ
        if: steps.decide.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secrets の RENDER_DEPLOY_HOOK が未設定なので反映できません（docs/OPERATIONS.md 4.10）"
            exit 1
          fi
          curl -fsS -X POST --max-time 30 -o /dev/null "$RENDER_DEPLOY_HOOK"
          echo "Render に反映を依頼しました。数分で切り替わります"

      - name: 反映したコミットを記録する
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: d } = await github.rest.repos.createDeployment({
              owner, repo, ref: context.sha, environment: 'render',
              auto_merge: false, required_contexts: [], description: 'Render への反映（Deploy Hook）' });
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: d.id, state: 'success',
              environment_url: 'https://nust-room-search.onrender.com' });
