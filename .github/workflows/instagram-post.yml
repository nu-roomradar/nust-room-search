name: Instagramへ投稿

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: "投稿の種類"
        required: true
        type: choice
        default: "feed"
        options:
          - feed
          - story
          - reel
      image_url:
        description: "投稿する画像の公開URL（https://...）。リールではカバー画像"
        required: true
        type: string
      video_url:
        description: "リールの動画（mp4）の公開URL。post_type=reel のときだけ使う"
        required: false
        type: string
      caption:
        description: "キャプション（フィード・リール。ストーリーズでは無視されます）"
        required: false
        type: string
      also_story:
        description: "告知ストーリーズも生成する（画像を確認してから post_story で投稿）"
        required: false
        type: boolean
        default: true
      post_story:
        description: "生成した告知ストーリーズをそのまま投稿する（未確認の画像が公開されます）"
        required: false
        type: boolean
        default: false
      story_headline:
        description: "告知ストーリーの見出し（未入力ならキャプションの1行目を使用）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        # 版とハッシュを固定
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/requests.txt

      # 入力値は env で渡す。run の中に inputs を式で直接書くと、キャプションの " や $( ) が
      # シェルのコマンドとして動いてしまう（2026-10 セキュリティ点検）
      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          POST_TYPE: ${{ inputs.post_type }}
          IMAGE_URL: ${{ inputs.image_url }}
          VIDEO_URL: ${{ inputs.video_url }}
          CAPTION: ${{ inputs.caption }}
        run: |
          if [ "$POST_TYPE" = "story" ]; then
            python scripts/post_to_instagram.py \
              --image-url "$IMAGE_URL" \
              --story
          elif [ "$POST_TYPE" = "reel" ]; then
            python scripts/post_to_instagram.py \
              --video-url "$VIDEO_URL" \
              --image-url "$IMAGE_URL" \
              --caption "$CAPTION"
          else
            python scripts/post_to_instagram.py \
              --image-url "$IMAGE_URL" \
              --caption "$CAPTION"
          fi

      # フィード投稿時のみ、その投稿を告知するストーリーズを生成して同時投稿する
      - name: Install Playwright (for promo story)
        if: ${{ inputs.post_type == 'feed' && inputs.also_story }}
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/story-promo.txt
          playwright install --with-deps chromium

      - name: Generate promo story image
        if: ${{ inputs.post_type == 'feed' && inputs.also_story }}
        env:
          # 見出しは story_headline で指定する。未入力ならキャプションの1行目
          STORY_CAPTION: ${{ inputs.caption }}
          STORY_HEADLINE: ${{ inputs.story_headline }}
          FEED_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          mkdir -p assets/instagram/auto
          python scripts/make_story_promo.py \
            --feed-image-url "$FEED_IMAGE_URL" \
            --caption "$STORY_CAPTION" \
            ${STORY_HEADLINE:+--headline "$STORY_HEADLINE"} \
            --out assets/instagram/auto/latest-story.png

      # 生成したストーリー画像は必ず成果物として残す。
      # 目視で確認してから、post_story を有効にして投稿すること。
      - name: Upload promo story for review
        if: ${{ inputs.post_type == 'feed' && inputs.also_story }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promo-story-preview
          path: assets/instagram/auto/latest-story.png

      - name: Commit promo story image
        if: ${{ inputs.post_type == 'feed' && inputs.also_story }}
        id: commit_story
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/instagram/auto/latest-story.png
          git commit -m "chore: generate promo story image for latest post"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ストーリーは画像を確認してから投稿する運用のため、明示的な post_story が必要。
      - name: Post promo story to Instagram
        if: ${{ inputs.post_type == 'feed' && inputs.also_story && inputs.post_story }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          REPO: ${{ github.repository }}
          STORY_SHA: ${{ steps.commit_story.outputs.sha }}
        run: |
          # コミットSHA固定のraw URLを使い、キャッシュによる古い画像配信を防ぐ
          URL="https://raw.githubusercontent.com/$REPO/$STORY_SHA/assets/instagram/auto/latest-story.png"
          python scripts/post_to_instagram.py --image-url "$URL" --story
