name: Renderプラン戻し忘れ防止リマインド

# 夏休み中はRenderをFreeに落としているため、後期の授業開始前に
# Starterへ戻す必要がある。その注意喚起としてIssueを自動作成する。
on:
  workflow_dispatch:
  schedule:
    # 9/24 09:07 JST（UTC 00:07）に一度だけ通知する想定
    - cron: "7 0 24 9 *"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "【要対応】RenderのプランをStarterへ戻す";
            const body = [
              "夏休み中に Render を Free プランへ落としているため、",
              "後期の授業開始・ポスター掲示に備えて **Starter へ戻す** 必要があります。",
              "",
              "## 手順",
              "1. https://dashboard.render.com/ を開く",
              "2. `nust-room-search` → 左メニュー **Settings**",
              "3. **Instance Type** の **Update** から **Starter** を選択",
              "4. 再起動後、https://nust-room-search.onrender.com が開けるか確認",
              "",
              "## 補足",
              "- プラン変更で再起動が入るため、その時点の「実は使われていた」報告（`reports.db`）は消えます。利用の少ない時間帯に実施してください。",
              "- Free のままだとスリープからの復帰に時間がかかり、「3秒で見つかる」という訴求と噛み合いません。",
              "- 戻したら、このIssueを閉じてください。",
              "",
              "---",
              "_このIssueは `.github/workflows/render-plan-reminder.yml` により自動作成されました。_",
              "_今後このリマインドが不要になったら、同ファイルを削除してください。_",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info("リマインドIssueを作成しました。");
