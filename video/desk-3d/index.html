<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>RoomRadar 3D 広告（机の上）</title>
<!-- 3D 広告（縦 1080×1920・30秒・7場面）。作り方と素材の出どころは README.md。
     書き出しは render.py（1コマずつ renderAt(t) を呼んで撮る）。hf-seek も受けるので HyperFrames からも時刻を送れる。 -->
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .cap { position: absolute; left: 80px; width: 920px; text-align: center; color: #fff; opacity: 0;
         font-family: 'RRSans', sans-serif; text-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 28px rgba(0,0,0,.55); }
  .cap.top { top: 268px; }
  .cap .big { font-weight: 900; font-size: 68px; line-height: 1.3; letter-spacing: .01em; }
  .cap .mid { font-weight: 900; font-size: 58px; line-height: 1.35; letter-spacing: .01em; }
  .cap .mid.sm { font-size: 50px; }
  #cap4b::before { height: 720px; background: linear-gradient(180deg, rgba(4,5,8,.97) 0%, rgba(4,5,8,.94) 58%, rgba(4,5,8,0) 100%); }
  .cap .big b, .cap .mid b { color: #5fe6d2; font-weight: 900; }
  .cap.top::before { content: ''; position: absolute; z-index: -1; left: -80px; top: -268px; width: 1080px; height: 760px; background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.50) 45%, rgba(0,0,0,0) 100%); }
  .cap .note { margin-top: 18px; font-weight: 500; font-size: 29px; line-height: 1.5; color: rgba(255,255,255,.86); }
  #word { top: 1052px; font-family: 'Syne', 'RRSans', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: .01em; }
  #word small { display: block; margin-top: 10px; font-family: 'RRSans', sans-serif; font-weight: 700; font-size: 31px; letter-spacing: .08em; color: rgba(255,255,255,.9); }
  #notice { top: 1284px; left: 110px; width: 860px; text-align: left; font-weight: 500; font-size: 33px; line-height: 1.7;
            color: rgba(255,255,255,.95); padding: 26px 30px; box-sizing: border-box; border-radius: 22px;
            background: rgba(12,10,8,.46); border: 1px solid rgba(255,255,255,.14); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #notice i { font-style: normal; display: inline-block; margin-right: 12px; padding: 1px 12px; border-radius: 8px; font-weight: 700; font-size: 22px;
              letter-spacing: .12em; color: #0c1413; background: #5fe6d2; text-shadow: none; vertical-align: 3px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="rr-desk-3d" data-width="1080" data-height="1920" data-duration="30">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="cap top" id="cap2"><div class="big">水曜3限でも、<b>24室</b>が空き</div><div class="note">時間割上の数。64室中、実験室なども含む</div></div>
  <div class="cap top" id="cap3"><div class="mid">いま空いている教室が、<br>すぐ見つかる</div></div>
  <div class="cap top" id="cap4"><div class="mid">使われていたら、<br>ひと押しで報告</div></div>
  <div class="cap top" id="cap4b"><div class="mid sm">2人以上の報告で<br><b>「使用中の可能性」</b>の表示に</div></div>
  <div class="cap top" id="cap5"><div class="mid">報告は、時限が終わると<br>自動で消える</div></div>
  <div class="cap" id="word">RoomRadar<small>空き教室検索</small></div>
  <div class="cap" id="notice"><i>TEST</i>本サービスは、学生が「自主創造プロジェクト」の一環として開発・運営している試験運用中のサービスです。大学が公式に提供するサービスではありません。</div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
