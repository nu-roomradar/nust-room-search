<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<!-- リール5「クリスマスモード」本編 v4（17.6秒）。2026-11-26 運営「もう一回構成から考えて」→「A と、AC 混合版二つお願い」。
     カミングスーン（r6.html）は雪の中からプレゼントの箱が飛び出して終わった。本編はその箱を開ける：
       箱がかたかた揺れ、ふたが浮いて光があふれる（3D：video/xmas-1124/teaser.py open）→ 光の中からスマホ → アプリの実画面 → 問いかけ → 最後の札。
     MODE='a'  ：クリスマスの見た目のアプリを実際に使う（「次」を押す → 一覧を流す → 教室を押して1週間の表）
     MODE='ac' ：3つの画面（検索・教室の1週間・教室さがし）で、いつもの見た目からクリスマスの見た目へ、拍に合わせて金色の線で塗りかわる
     r7c.html は、この MODE の行だけを 'ac' に変えた写し（sed で作る）。画面は実物（video/xmas-1124/capture2.py。12/1 火 13:40・駿河台校舎。船橋は映さない）。
     字は明朝。音は music.py r7（-22 LUFS）。特定の会社の映像・ロゴ・曲は使わない。 -->
<link rel="stylesheet" href="common.css">
<style>
@font-face{font-family:'Min';font-weight:500;src:url(fonts/NotoSerifCJKjp-Medium.otf)}
@font-face{font-family:'Min';font-weight:600;src:url(fonts/NotoSerifCJKjp-SemiBold.otf)}
@font-face{font-family:'Min';font-weight:700;src:url(fonts/NotoSerifCJKjp-Bold.otf)}
body{background:#000}
.bg{background:#000}
#box{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 48%}
#glow,#snow,#csfx{position:absolute;inset:0;pointer-events:none}
#world{position:absolute;inset:0;opacity:0;background:radial-gradient(900px 1000px at 50% 46%,rgba(255,206,130,.30),transparent 70%),radial-gradient(1100px 900px at 50% 105%,rgba(30,120,80,.42),transparent 70%),linear-gradient(180deg,#071226 0%,#0a1c33 55%,#0b2a2a 100%)}
.bokeh{position:absolute;border-radius:50%;filter:blur(34px);opacity:0;mix-blend-mode:screen}
.flash{position:absolute;inset:0;background:#fff3dc;opacity:0}
.black{position:absolute;inset:0;background:#000}
#stage{position:absolute;inset:0;perspective:2400px;opacity:0}
#ph{position:absolute;left:210px;top:262px;width:660px;height:1396px;border-radius:92px;background:linear-gradient(145deg,#3a3f48,#14161b 40%,#2a2e36);box-shadow:0 0 0 2px #50555f,0 40px 120px rgba(0,0,0,.6),0 0 140px rgba(255,200,120,.22);transform-origin:50% 55%;will-change:transform}
#scr{position:absolute;left:14px;top:14px;width:632px;height:1368px;border-radius:80px;overflow:hidden;background:#000}
#scr .ly{position:absolute;left:0;top:0;width:632px;opacity:0;will-change:transform,opacity,clip-path}
#scr .isl{position:absolute;left:221px;top:18px;width:190px;height:54px;border-radius:27px;background:#000;z-index:9}
#scr .sheen{position:absolute;inset:0;z-index:8;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.02) 60%,transparent 70%)}
#edge{position:absolute;top:0;width:10px;height:1368px;margin-left:-5px;opacity:0;z-index:7;background:linear-gradient(90deg,transparent,#ffe2a6,#fff,#ffe2a6,transparent);box-shadow:0 0 40px 14px rgba(255,214,140,.7)}
#tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:6px solid rgba(255,255,255,.95);background:rgba(255,255,255,.16);box-shadow:0 0 26px rgba(255,255,255,.7);opacity:0;z-index:9}
.lab{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:'Min';font-weight:600;font-size:50px;letter-spacing:.2em;padding-left:.2em;color:#fff3e2;opacity:0;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.lab b{font-weight:600;color:#ffd79a}
#ask{position:absolute;inset:0;opacity:0}
#ask .q{position:absolute;left:0;right:0;top:700px;text-align:center;font-family:'Min';font-weight:700;font-size:92px;line-height:1.38;letter-spacing:.06em;padding-left:.06em;color:#fff7ec;text-shadow:0 0 40px rgba(255,200,140,.35)}
#ask .q b{font-weight:700;color:#ffd79a}
#ask .r{position:absolute;left:0;right:0;top:1010px;text-align:center;font-family:'Min';font-weight:600;font-size:44px;letter-spacing:.08em;padding-left:.08em;color:#f0e2cc}
#ask .c{position:absolute;left:0;right:0;top:1350px;text-align:center;font-weight:500;font-size:33px;line-height:1.7;color:rgba(255,226,196,.95);text-shadow:0 2px 14px rgba(0,0,0,.7)}
#cs{position:absolute;inset:0;opacity:0;background:radial-gradient(820px 700px at 50% 42%,rgba(46,26,30,.88),#000 78%)}
#cs .d{position:absolute;left:0;right:0;top:520px;text-align:center;font-family:'Min';font-weight:700;font-size:250px;line-height:1;letter-spacing:.04em;padding-left:.04em;color:#fff6ea;text-shadow:0 0 60px rgba(255,190,120,.42)}
#cs .rule{position:absolute;left:50%;top:850px;width:120px;height:2px;margin-left:-60px;background:linear-gradient(90deg,transparent,#e9c27c,transparent)}
#cs .m{position:absolute;left:0;right:0;top:900px;text-align:center;font-family:'Min';font-weight:600;font-size:60px;line-height:1.55;letter-spacing:.12em;padding-left:.12em;color:#f4e6d2}
#cs .logo{position:absolute;left:50%;top:1130px;width:190px;margin-left:-95px;opacity:.92}
#cs .n{position:absolute;left:130px;right:130px;top:1340px;text-align:center;font-weight:400;font-size:27px;line-height:1.75;color:rgba(214,222,238,.66)}
</style></head>
<body>
<div class="bg"></div>
<img id="box" src="assets/xm_open/f0000.png" alt="">
<canvas id="glow" width="1080" height="1920"></canvas>
<div id="world"></div>
<div id="bokehs"></div>
<div id="stage">
  <div id="ph"><div id="scr">
    <img class="ly" id="L1" alt=""><img class="ly" id="L2" alt=""><img class="ly" id="L3" alt=""><img class="ly" id="L4" alt="">
    <img class="ly" id="L5" alt=""><img class="ly" id="L6" alt=""><img class="ly" id="L7" alt="">
    <div id="edge"></div><div id="tap"></div><div class="sheen"></div><div class="isl"></div>
  </div></div>
</div>
<canvas id="snow" width="1080" height="1920"></canvas>
<div class="lab" id="lab1"></div><div class="lab" id="lab2"></div>
<div class="flash" id="flash"></div>
<div id="ask">
  <div class="q">次の空きコマ、<br><b>もう決めた？</b></div>
  <div class="r">空きコマが同じ友だちに、送ってみて。</div>
  <div class="c">時間割にない授業もあります。<br>入る前に、ドア越しに確認を。</div>
</div>
<div id="cs">
  <canvas id="csfx" width="1080" height="1920"></canvas>
  <div class="d">12.1</div>
  <div class="rule"></div>
  <div class="m">クリスマスモード、<br>はじまりました。</div>
  <img class="logo" src="assets/logo.png" alt="">
  <div class="n"></div>
</div>
<div class="black" id="blk"></div>

<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
const MODE = 'ac';
document.querySelector('#cs .n').textContent = NOTE;
const tl = gsap.timeline({ paused: true }); window.TL = tl; window.DURATION = 17.6;
const S = 3.55, BAR = 1.5, ASK = 9.55, END = 12.55, K = 632 / 390;     // 光があふれる時刻・1小節・問いかけ・最後の札・画面の倍率
const bar = k => S + BAR * k;
const pad = f => String(f).padStart(4, '0');
const box = document.getElementById('box');
const $ = id => document.getElementById(id);
const SRC = MODE === 'a'
  ? { L1: 'main_x', L2: 'nextlong_x', L3: 'room_x' }
  : { L1: 'main_n', L2: 'main_x', L3: 'room_n', L4: 'room_x', L5: 'find_n', L6: 'find_x', L7: 'nextlong_x' };
window.READY = false;
Promise.all(Object.entries(SRC).map(([id, n]) => { $(id).src = `assets/xs_${n}.png`; return $(id).decode(); })).then(() => { window.READY = true; });

// ── 雪と光の粒（毎回同じ位置になるよう、決まった数列で並べる） ──
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gw = $('glow').getContext('2d'), sw = $('snow').getContext('2d'), fx = $('csfx').getContext('2d');
const FL = Array.from({ length: 120 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 1.6 + rnd() * 4.2, v: 60 + rnd() * 120, sw: 10 + rnd() * 30, ph: rnd() * 6.28, o: 0.35 + rnd() * 0.5 }));
const FLK = Array.from({ length: 48 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 1.6 + rnd() * 3.2, v: 38 + rnd() * 52, sw: 8 + rnd() * 22, ph: rnd() * 6.28, o: 0.22 + rnd() * 0.38 }));
const SPK = Array.from({ length: 70 }, () => ({ a: rnd() * 6.28, v: 260 + rnd() * 900, r: 2 + rnd() * 5, t0: rnd() * 0.9, o: 0.5 + rnd() * 0.5 }));
const BCOL = ['rgba(255,80,90,.7)', 'rgba(255,200,110,.75)', 'rgba(60,200,130,.6)', 'rgba(255,240,210,.6)'];
[[90, 260], [990, 400], [120, 1560], [980, 1660], [50, 900], [1030, 1090], [300, 110], [800, 1830], [70, 1250], [1000, 760]].forEach(([x, y], i) => {
  const e = document.createElement('div'); e.className = 'bokeh'; const s = 80 + (i * 37) % 100;
  Object.assign(e.style, { width: s + 'px', height: s + 'px', left: x - s / 2 + 'px', top: y - s / 2 + 'px', background: BCOL[i % 4] });
  $('bokehs').appendChild(e);
});
function drawSnow(ctx, flakes, t, t0, alpha) {
  ctx.clearRect(0, 0, 1080, 1920);
  if (alpha <= 0) return;
  for (const f of flakes) {
    const y = (f.y + (t - t0) * f.v) % 1960 - 20, x = f.x + Math.sin(t * 0.8 + f.ph) * f.sw;
    ctx.fillStyle = `rgba(255,248,236,${(f.o * alpha).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, f.r, 0, Math.PI * 2); ctx.fill();
  }
}
// 箱のすき間からもれる光（だんだん強く、最後は画面いっぱい）と、飛び出す光の粒
const GAP = t => [540, 905 + 150 * Math.min(1, t / 3.2)];
function drawGlow(t) {
  gw.clearRect(0, 0, 1080, 1920);
  if (t > S + 0.9) return;
  const [gx, gy] = GAP(t), k = Math.min(1, Math.max(0, (t - 0.9) / (S - 0.9))), fade = t > S ? Math.max(0, 1 - (t - S) / 0.9) : 1;
  if (k <= 0) return;
  gw.globalCompositeOperation = 'lighter';
  const r = 60 + 2300 * Math.pow(k, 3.2), a = (0.25 + 0.75 * k) * fade * (0.9 + 0.1 * Math.sin(t * 31));
  let g = gw.createRadialGradient(gx, gy, 0, gx, gy, r);
  g.addColorStop(0, `rgba(255,246,220,${a.toFixed(3)})`); g.addColorStop(0.3, `rgba(255,212,140,${(0.6 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(255,190,100,0)');
  gw.fillStyle = g; gw.fillRect(0, 0, 1080, 1920);
  // 横に走る光の筋
  const w = 300 + 1500 * k * k; g = gw.createLinearGradient(gx - w, 0, gx + w, 0);
  g.addColorStop(0, 'rgba(255,230,180,0)'); g.addColorStop(0.5, `rgba(255,244,214,${(0.8 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(255,230,180,0)');
  gw.fillStyle = g; gw.fillRect(gx - w, gy - 5 - 14 * k, 2 * w, 10 + 28 * k);
  // 光の粒（1.6秒から、上へ吹き出す）
  for (const p of SPK) {
    const tt = t - 1.6 - p.t0 * 1.6; if (tt <= 0) continue;
    const life = (tt % 1.1) / 1.1, d = p.v * life * (0.5 + k), x = gx + Math.cos(p.a) * d * 0.7, y = gy - Math.abs(Math.sin(p.a)) * d - 60 * life;
    gw.fillStyle = `rgba(255,236,190,${(p.o * (1 - life) * k * fade).toFixed(3)})`; gw.beginPath(); gw.arc(x, y, p.r * (1 - 0.5 * life), 0, Math.PI * 2); gw.fill();
  }
  gw.globalCompositeOperation = 'source-over';
}
window.BG3D = async t => {
  if (t < S + 0.3) {
    const f = Math.min(96, Math.max(0, Math.round(t * 30)));
    const src = `assets/xm_open/f${pad(f)}.png`;
    if (!box.src.endsWith(src)) { box.src = src; await box.decode(); }
  }
  drawGlow(t);
  const a = Math.min(1, Math.max(0, (t - S - 0.2) / 0.8)) * (t > END + 0.2 ? Math.max(0, 1 - (t - END - 0.2) / 0.4) : 1);
  drawSnow(sw, FL, t, 0, a);
  drawSnow(fx, FLK, t, END, Math.min(1, Math.max(0, (t - END - 0.8) / 1.2)));
  // スマホがゆっくり揺れる
  if (t > S && t < END + 0.5) gsap.set('#ph', { rotationY: 5 * Math.sin((t - S) * 0.9), rotationX: 2.2 * Math.sin((t - S) * 0.7 + 1) });
};
const tapAt = (x, y, at) => tl.set('#tap', { left: x * K, top: y * K }, at - 0.2)
  .fromTo('#tap', { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.16, ease: 'power2.out' }, at - 0.2)
  .to('#tap', { opacity: 0, scale: 0.75, duration: 0.25 }, at + 0.02);

// 0. 暗いところから、雪の上の箱
tl.fromTo('#blk', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.out' }, 0)
  .fromTo('#box', { scale: 1.0 }, { scale: 1.05, duration: S, ease: 'power1.in' }, 0);
// 1. 光があふれる（3.55秒）→ 光の中からスマホ
tl.fromTo('#flash', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.in' }, S - 0.3)
  .set('#world', { opacity: 1 }, S).set('#stage', { opacity: 1 }, S)
  .to('#flash', { opacity: 0, duration: 1.0, ease: 'power2.out' }, S + 0.05)
  .fromTo('#ph', { scale: 0.55, y: 160 }, { scale: 1, y: 0, duration: 1.0, ease: 'back.out(1.25)' }, S)
  .to('.bokeh', { opacity: 0.5, duration: 1.0, stagger: 0.04 }, S + 0.2);
if (MODE === 'a') {
  $('lab1').innerHTML = '検索画面が、<b>クリスマスに。</b>';
  tl.set('#L1', { opacity: 1 }, 0)
    .fromTo('#lab1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6 }, S + 0.7);
  tapAt(195, 390, bar(1));                                                 // 「次（火曜4限）」を押す
  tl.to('#L2', { opacity: 1, duration: 0.18 }, bar(1) + 0.08)
    .to('#L2', { y: -150 * K, duration: 1.0, ease: 'power2.inOut' }, bar(1) + 0.75)      // 一覧を下へ流して
    .to('#L2', { y: 0, duration: 0.8, ease: 'power2.inOut' }, bar(2) + 0.45);            // 上へ戻る
  tapAt(316, 597, bar(3));                                                 // 教室 133 を押す
  tl.fromTo('#L3', { opacity: 1, x: 632 }, { x: 0, duration: 0.4, ease: 'power3.out', immediateRender: false }, bar(3) + 0.08);
} else {
  $('lab1').innerHTML = 'いつもの見た目';
  $('lab2').innerHTML = '<b>クリスマスの見た目</b>';
  const sweep = (from, to, at) => {                                        // 金色の線が左から右へ走り、通ったところからクリスマスの見た目になる
    tl.set(to, { opacity: 1, clipPath: 'inset(0 100% 0 0)' }, at)
      .to(to, { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'power2.inOut' }, at)
      .fromTo('#edge', { left: 0, opacity: 1 }, { left: 632, duration: 0.5, ease: 'power2.inOut', immediateRender: false }, at).set('#edge', { opacity: 0 }, at + 0.5)
      .to('#lab1', { opacity: 0, duration: 0.2 }, at).to('#lab2', { opacity: 1, duration: 0.25 }, at + 0.15);
  };
  const cut = (id, at) => tl.set('.ly', { opacity: 0 }, at).fromTo(id, { opacity: 1, scale: 1.04, clipPath: 'none' }, { scale: 1, duration: 0.35, ease: 'power2.out', immediateRender: false }, at)
    .set('#lab2', { opacity: 0 }, at).set('#lab1', { opacity: 1 }, at);
  tl.set('#L1', { opacity: 1 }, 0).fromTo('#lab1', { opacity: 0 }, { opacity: 1, duration: 0.4 }, S + 0.5);
  sweep('#L1', '#L2', bar(0) + 1.0);                                       // 検索
  cut('#L3', bar(1)); sweep('#L3', '#L4', bar(1) + 1.0);                   // 教室の1週間
  cut('#L5', bar(2)); sweep('#L5', '#L6', bar(2) + 1.0);                   // 教室さがし
  tl.set('.ly', { opacity: 0 }, bar(3)).fromTo('#L7', { opacity: 1, scale: 1.04, clipPath: 'none' }, { scale: 1, duration: 0.35, immediateRender: false }, bar(3))
    .to('#L7', { y: -150 * K, duration: 1.4, ease: 'power1.inOut' }, bar(3) + 0.1);       // 最後はクリスマスの見た目の一覧を流す
}
// 2. 問いかけ（9.55〜12.4秒）：スマホは後ろへ下がってぼける
tl.to('#stage', { filter: 'blur(14px) brightness(0.4)', scale: 0.92, duration: 0.5, ease: 'power1.inOut' }, ASK - 0.15)
  .to('.lab', { opacity: 0, duration: 0.3 }, ASK - 0.2)
  .to('#ask', { opacity: 1, duration: 0.5 }, ASK)
  .from('#ask .q', { y: 30, filter: 'blur(8px)', duration: 0.8, ease: 'power3.out' }, ASK)
  .from('#ask .r', { opacity: 0, duration: 0.5 }, ASK + 0.6)
  .from('#ask .c', { opacity: 0, duration: 0.5 }, ASK + 0.9)
  .to(['#ask', '.bokeh'], { opacity: 0, duration: 0.4 }, END - 0.25);
// 3. 最後の札（12.55秒〜）
tl.to('#cs', { opacity: 1, duration: 0.6 }, END - 0.1)
  .from('#cs .d', { scale: 0.94, opacity: 0, filter: 'blur(14px)', duration: 1.1, ease: 'power3.out' }, END)
  .from('#cs .rule', { scaleX: 0, duration: 0.7, ease: 'power2.out' }, END + 0.5)
  .from('#cs .m', { opacity: 0, letterSpacing: '.28em', duration: 1.0, ease: 'power3.out' }, END + 0.55)
  .from('#cs .logo', { opacity: 0, y: 14, duration: 0.6 }, END + 0.9)
  .from('#cs .n', { opacity: 0, duration: 0.5 }, END + 1.0)
  .fromTo('#cs', { scale: 1 }, { scale: 1.035, duration: window.DURATION - END, ease: 'none' }, END)
  .to('#blk', { opacity: 1, duration: 1.0, ease: 'power1.in' }, window.DURATION - 1.1);
tl.to({}, { duration: 0.01 }, window.DURATION);
</script>
</body></html>
