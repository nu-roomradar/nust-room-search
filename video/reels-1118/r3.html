<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<!-- リール3「空きコマ、みんな何してる？」（13.6秒）。数字はアプリの任意・匿名の質問「何に使う？」の回答140件（data/ga4_breakdown.json の purposes。〜2026-11-15） -->
<link rel="stylesheet" href="common.css">
<style>
#a .k{top:600px}
#a .t{top:700px;font-size:118px}
#r .head{top:220px;font-weight:900;font-size:72px;line-height:1.3}
.rows{position:absolute;left:70px;right:70px;top:430px;display:grid;gap:30px}
.row{position:relative;display:grid;grid-template-columns:110px 1fr;align-items:center;gap:26px;opacity:0}
.rk{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:Syne;font-weight:800;font-size:54px;background:rgba(255,255,255,.1);border:3px solid rgba(127,168,255,.4)}
.lb{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:58px;margin-bottom:12px}
.lb .p{font-family:Syne;font-weight:800;font-size:60px;color:var(--sub)}
.bar{height:26px;border-radius:13px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:13px;background:linear-gradient(90deg,#2f6bff,#22c3e6)}
.row.top .rk{background:linear-gradient(135deg,#ff7a59,#f6a35c);border:0;font-size:64px;width:128px;height:128px}
.row.top{grid-template-columns:128px 1fr}
.row.top .lb{font-size:76px}
.row.top .lb .p{color:var(--orange);font-size:84px}
.row.top .bar{height:34px}
.row.top .bar i{background:linear-gradient(90deg,#ff7a59,#f6a35c)}
.burst{position:absolute;left:150px;top:440px;width:10px;height:10px}
.burst b{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--orange);opacity:0}
.src{position:absolute;left:90px;right:90px;top:1420px;text-align:center;font-weight:500;font-size:30px;line-height:1.6;color:var(--mute)}
#m .t{top:420px;font-weight:900;font-size:90px;line-height:1.3}
.chips{position:absolute;left:80px;right:80px;top:820px;display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.chips span{font-weight:900;font-size:50px;padding:22px 38px;border-radius:99px;background:rgba(34,197,94,.14);border:3px solid rgba(34,197,94,.55);color:#bdf5cf}
#m .s{top:1150px;font-weight:700;font-size:42px;color:var(--sub);line-height:1.6}
</style></head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="scene" id="a">
  <div class="c kick k">RoomRadar の利用者に聞きました</div>
  <div class="c big t">空きコマ、<br><span class="o">みんな何してる？</span></div>
</div>

<div class="scene" id="r">
  <div class="c head">空き教室で<span class="o">何をする？</span></div>
  <div class="rows">
    <div class="row top" id="r1"><div class="rk">1</div><div><div class="lb"><span>個人学習</span><span class="p"><span id="p1">0</span>%</span></div><div class="bar"><i id="b1"></i></div></div></div>
    <div class="row" id="r2"><div class="rk">2</div><div><div class="lb"><span>休憩</span><span class="p"><span id="p2">0</span>%</span></div><div class="bar"><i id="b2"></i></div></div></div>
    <div class="row" id="r3"><div class="rk">3</div><div><div class="lb"><span>グループワーク</span><span class="p"><span id="p3">0</span>%</span></div><div class="bar"><i id="b3"></i></div></div></div>
    <div class="row" id="r4"><div class="rk">4</div><div><div class="lb"><span>打合せ</span><span class="p"><span id="p4">0</span>%</span></div><div class="bar"><i id="b4"></i></div></div></div>
    <div class="row" id="r5"><div class="rk">5</div><div><div class="lb"><span>その他</span><span class="p"><span id="p5">0</span>%</span></div><div class="bar"><i id="b5"></i></div></div></div>
  </div>
  <div class="burst" id="burst"></div>
  <div class="src">アプリの任意・匿名の質問「何に使う？」の回答 140件（2026年11月15日まで）</div>
</div>

<div class="scene" id="m">
  <div class="c t">空き教室で、<br><span class="g">それぞれの空きコマを。</span></div>
  <div class="chips"><span>授業が優先</span><span>静かに</span><span>ゴミは持ち帰る</span></div>
  <div class="c s">空き教室は、みんなで使う場所です。</div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
// 回答の数（個人学習 80・休憩 27・グループワーク 15・打合せ 12・その他 6、計140）を割合にした値
const PCT = { 1: 57, 2: 19, 3: 11, 4: 9, 5: 4 };
const burst = document.getElementById('burst');
for (let i = 0; i < 14; i++) { const b = document.createElement('b'); burst.appendChild(b); }

const tl = gsap.timeline({ paused: true }); window.TL = tl; window.DURATION = 13.6;
// 1. つかみ（0〜1.8秒）
show(tl, '#a', 0, 0.01);
tl.from('#a .k', { y: 30, opacity: 0, duration: 0.3 }, 0)
  .from('#a .t', { scale: 1.3, opacity: 0, duration: 0.4, ease: 'power3.out' }, 0.1);
hide(tl, '#a', 1.75, 0.2);
// 2. ランキング（1.9〜8.6秒）：5位から順に、1位は少しためてから
show(tl, '#r', 1.9, 0.15);
tl.from('#r .head', { y: -30, opacity: 0, duration: 0.3 }, 1.9).from('.src', { opacity: 0, duration: 0.3 }, 2.1);
const at = { 5: 2.2, 4: 3.0, 3: 3.8, 2: 4.6, 1: 5.9 };
[5, 4, 3, 2, 1].forEach(r => {
  const t = at[r];
  tl.to(`#r${r}`, { opacity: 1, duration: 0.2 }, t)
    .from(`#r${r}`, { x: r === 1 ? 0 : 120, scale: r === 1 ? 1.25 : 1, duration: 0.35, ease: r === 1 ? 'back.out(2)' : 'power3.out' }, t)
    .to(`#b${r}`, { width: `${PCT[r] / 57 * 100}%`, duration: r === 1 ? 0.8 : 0.5, ease: 'power2.out' }, t + 0.1)
    .fromTo(`#p${r}`, { textContent: 0 }, { textContent: PCT[r], duration: r === 1 ? 0.8 : 0.5, snap: { textContent: 1 }, ease: 'power2.out' }, t + 0.1);
});
document.querySelectorAll('#burst b').forEach((b, i) => {
  const a = i / 14 * Math.PI * 2, d = 160 + (i % 3) * 50;
  tl.fromTo(b, { x: 0, y: 0, opacity: 1, scale: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d, opacity: 0, scale: 0.3, duration: 0.8, ease: 'power2.out', immediateRender: false }, 6.0);
});
hide(tl, '#r', 8.5, 0.2);
// 3. ひとこと（8.7〜11.0秒）
show(tl, '#m', 8.7, 0.15);
tl.from('#m .t', { y: 40, opacity: 0, duration: 0.4 }, 8.7)
  .from('.chips span', { scale: 0.6, opacity: 0, duration: 0.3, stagger: 0.15, ease: 'back.out(2)' }, 9.2)
  .from('#m .s', { opacity: 0, duration: 0.3 }, 9.8);
hide(tl, '#m', 10.9, 0.2);
// 4. 終わりの札（11.0〜13.6秒）
addEnd(tl, 11.0, '今日の空き教室は、<br><span class="g">RoomRadar</span> で。');
tl.to({}, { duration: 0.01 }, window.DURATION);
</script>
</body></html>
