<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<!-- リール4「開けたら、空いてる」（11.0秒）。広告ふうの画像3枚（video/ad-1119 の 3D。縦長で描き直し）を、ゆっくり寄るカメラと明朝の縦書きで見せる。
     核の言葉は「時間割にない授業もある」の注意と必ず組で出す（下に出しっぱなし）。最後にロゴと必須の表記。
     素材：assets/ad_door.png・ad_hero.png・ad_room.png（python3 ../ad-1119/scene2.py <door|hero|room> final tall を写す）、fonts/NotoSerifCJKjp-SemiBold.otf -->
<link rel="stylesheet" href="common.css">
<style>
@font-face{font-family:'Min';font-weight:600;src:url(fonts/NotoSerifCJKjp-SemiBold.otf)}
.shot{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;opacity:0;will-change:transform,opacity}
.topshade{position:absolute;left:0;right:0;top:0;height:900px;background:linear-gradient(180deg,rgba(3,6,16,.5),rgba(3,6,16,0))}
.botshade{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(0deg,rgba(3,6,16,.86),rgba(3,6,16,.5) 55%,rgba(3,6,16,0))}
.dark{position:absolute;inset:0;background:rgba(4,8,20,.66);opacity:0}
.mark{position:absolute;left:72px;top:170px;display:flex;align-items:center;gap:16px;opacity:0}
.mark img{width:120px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.mark b{font-family:Syne;font-weight:700;font-size:34px;letter-spacing:.16em;color:rgba(245,242,234,.94);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.copy{position:absolute;right:118px;top:210px;writing-mode:vertical-rl;font-family:'Min';font-weight:600;font-size:74px;line-height:1.72;letter-spacing:.12em;color:#f5f2ea;text-shadow:0 2px 28px rgba(0,0,0,.55)}
.copy span{display:block}
.copy span:nth-child(2){padding-top:1.5em}
.copy.wide span:nth-child(2){padding-top:3.1em}
.caution{position:absolute;left:0;right:0;top:1500px;text-align:center;font-weight:700;font-size:40px;line-height:1.55;letter-spacing:.04em;color:#ffd9b0;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:0}
</style></head>
<body>
<img class="shot" id="p1" src="assets/ad_door.png" alt="" style="transform-origin:28% 70%">
<img class="shot" id="p2" src="assets/ad_hero.png" alt="" style="transform-origin:42% 66%">
<img class="shot" id="p3" src="assets/ad_room.png" alt="" style="transform-origin:62% 62%">
<div class="topshade"></div><div class="botshade"></div><div class="dark" id="dark"></div>
<div class="mark"><img src="assets/logo.png" alt=""><b>RoomRadar</b></div>

<div class="copy wide" id="c1"><span>「開けたら、空いてる」を</span><span>当たり前に。</span></div>
<div class="copy" id="c2"><span>探す五分、</span><span>過ごす五分。</span></div>
<div class="copy" id="c3"><span>空きコマに、</span><span>行き先を。</span></div>
<div class="caution">時間割にない授業もあります。<br>入る前に、ドア越しに確認を。</div>

<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
const tl = gsap.timeline({ paused: true }); window.TL = tl; window.DURATION = 11.0;
const CUT = [0, 3.3, 5.7, 8.1];                       // 扉 → 本とスマホ → 夕方の教室 → 終わりの札
gsap.set('.copy span', { clipPath: 'inset(0% 0% 100% 0%)' });
// 絵：ゆっくり寄る。次の絵へは 0.5 秒で溶かす
['#p1', '#p2', '#p3'].forEach((id, i) => {
  const a = CUT[i], z = CUT[i + 1];
  tl.fromTo(id, { opacity: i === 0 ? 1 : 0 }, { opacity: 1, duration: i === 0 ? 0.01 : 0.5, ease: 'power1.inOut' }, Math.max(0, a - 0.25))
    .fromTo(id, { scale: 1.0 }, { scale: 1.09, duration: z - a + 0.8, ease: 'none' }, Math.max(0, a - 0.25));
  if (i < 2) tl.to(id, { opacity: 0, duration: 0.5, ease: 'power1.inOut' }, z - 0.25);
  // 言葉：上から下へ、1行ずつ現れる
  const c = `#c${i + 1}`;
  tl.to(`${c} span:nth-child(1)`, { clipPath: 'inset(0% 0% 0% 0%)', duration: i === 0 ? 1.0 : 0.6, ease: 'power2.out' }, a + (i === 0 ? 0.15 : 0.3))
    .to(`${c} span:nth-child(2)`, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.6, ease: 'power2.out' }, a + (i === 0 ? 1.25 : 0.95))
    .to(c, { opacity: 0, duration: 0.3 }, z - 0.35);
});
tl.to('.mark', { opacity: 1, duration: 0.5 }, 0.1)
  .to('.caution', { opacity: 1, duration: 0.5 }, 1.6)
  .to(['.mark', '.caution'], { opacity: 0, duration: 0.3 }, CUT[3] - 0.35);
// 終わりの札：教室の絵をぼかして暗くした上に、ロゴと必須の表記
tl.to('#p3', { filter: 'blur(14px)', duration: 0.5 }, CUT[3] - 0.25)
  .to('#dark', { opacity: 1, duration: 0.5 }, CUT[3] - 0.25);
addEnd(tl, CUT[3], '「開けたら、空いてる」を<span class="o">当たり前に。</span>');
tl.to({}, { duration: 0.01 }, window.DURATION);
</script>
</body></html>
